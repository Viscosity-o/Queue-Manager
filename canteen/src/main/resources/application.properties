# ── Database (Supabase Session Pooler - IPv4 compatible) ─────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.eylvvctjyivjcxaodabc}
spring.datasource.password=${DB_PASSWORD:Paras@210905}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool settings for Supabase free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
